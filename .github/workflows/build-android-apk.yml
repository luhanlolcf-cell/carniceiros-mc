name: Build Android APK (Carniceiros MC)

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK Android e Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências Capacitor e sincronizar App Web
        working-directory: mobile
        run: |
          npm ci
          npm run sync:android

      - name: Preparar Keystore de Assinatura Android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CMC_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.CMC_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.CMC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CMC_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode --ignore-garbage > /tmp/cmc-release.keystore
            echo "CMC_KEYSTORE_PATH=/tmp/cmc-release.keystore" >> "$GITHUB_ENV"
            echo "CMC_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "CMC_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CMC_KEY_PASS=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "Usando Keystore persistente do repositório."
          else
            FALLBACK_PASS="CarniceirosMC#2026"
            keytool -genkeypair -v \
              -keystore /tmp/cmc-release.keystore \
              -alias carniceirosmc \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$FALLBACK_PASS" -keypass "$FALLBACK_PASS" \
              -dname "CN=Carniceiros MC, OU=Secretaria, O=Carniceiros MC, L=Curitiba, ST=PR, C=BR"
            echo "CMC_KEYSTORE_PATH=/tmp/cmc-release.keystore" >> "$GITHUB_ENV"
            echo "CMC_KEYSTORE_PASS=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "CMC_KEY_ALIAS=carniceirosmc" >> "$GITHUB_ENV"
            echo "CMC_KEY_PASS=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "Usando Keystore temporária para assinatura Release."
          fi

      - name: Compilar APK Release (Gradle)
        working-directory: mobile/android
        env:
          CMC_VERSION_CODE: ${{ github.run_number }}
          CMC_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar arquivos APK finais
        shell: bash
        run: |
          mkdir -p dist-apk
          RELEASE_APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Erro: nenhum APK encontrado!"
            exit 1
          fi
          cp "$RELEASE_APK" "dist-apk/Carniceiros-MC.apk"
          cp "$RELEASE_APK" "dist-apk/Carniceiros-MC-v1.0.${{ github.run_number }}.apk"
          ls -lh dist-apk/

      - name: Salvar APK como Artifact do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Carniceiros-MC-Android-APK
          path: dist-apk/*.apk

      - name: Publicar APK no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          printf '%s\n' \
            'Aplicativo Android oficial do **Carniceiros MC (Curitiba • PR • BR)**.' \
            '' \
            '### Como instalar no Android:' \
            '1. Baixe o arquivo **Carniceiros-MC.apk** abaixo.' \
            '2. Toque no arquivo baixado e permita a instalação por esta fonte.' \
            '3. Ao abrir, clique no seu nome na lista de integrantes (1º acesso cria sua senha).' \
            '' \
            '- Versão: `1.0.${{ github.run_number }}`' \
            '- Modo offline + anexos habilitados' > /tmp/release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist-apk/Carniceiros-MC.apk \
              "dist-apk/Carniceiros-MC-v1.0.${{ github.run_number }}.apk" \
              --clobber
            gh release edit "$TAG" \
              --title "Carniceiros MC Android APK (v1.0.${{ github.run_number }})" \
              --notes-file /tmp/release_notes.md \
              --latest
          else
            gh release create "$TAG" \
              dist-apk/Carniceiros-MC.apk \
              "dist-apk/Carniceiros-MC-v1.0.${{ github.run_number }}.apk" \
              --target "${{ github.sha }}" \
              --title "Carniceiros MC Android APK (v1.0.${{ github.run_number }})" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi
